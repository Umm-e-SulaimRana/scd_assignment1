# Release -- runs on a v* tag (§3.4).
#
# CD deploys by commit SHA, which is precise but unreadable. A tag is the
# human-facing name for a SHA someone decided was worth naming. This workflow
# adds semver tags to the images that already exist for that commit and
# writes release notes; it does not rebuild them.
#
#   git tag -a v1.0.0 -m "First submission" && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test

  publish:
    needs: [test]                 # gated, like every other publishing job
    runs-on: ubuntu-24.04
    permissions:
      contents: write             # only this job writes, and only to create the Release
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so the notes can diff against the last tag

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive the semver tags
        id: semver
        run: |
          full="${GITHUB_REF_NAME#v}"           # 1.2.3
          echo "full=$full"                >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}"          >> "$GITHUB_OUTPUT"   # 1.2
          echo "major=${full%%.*}"         >> "$GITHUB_OUTPUT"   # 1

      - name: Re-tag the existing images rather than rebuilding them
        # Rebuilding would produce different bytes from the same source
        # (timestamps, transitively-resolved dependencies) and the release
        # would no longer be the artefact that was tested and scanned.
        # `docker buildx imagetools create` copies the manifest, not the layers.
        run: |
          for img in backend frontend; do
            src="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/$img:${{ github.sha }}"
            echo "retagging $src"
            docker buildx imagetools create "$src" \
              --tag "${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/$img:v${{ steps.semver.outputs.full }}" \
              --tag "${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/$img:${{ steps.semver.outputs.minor }}" \
              --tag "${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/$img:${{ steps.semver.outputs.major }}"
            docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/$img:v${{ steps.semver.outputs.full }}" \
              --format '{{.Manifest.Digest}}'
          done

      - name: Write the release notes
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "## CivicPulse ${GITHUB_REF_NAME}"
            echo ""
            echo "Built from \`${GITHUB_SHA}\`."
            echo ""
            echo "### Images"
            echo ""
            echo "    ghcr.io/${{ steps.repo.outputs.name }}/backend:${GITHUB_REF_NAME}"
            echo "    ghcr.io/${{ steps.repo.outputs.name }}/frontend:${GITHUB_REF_NAME}"
            echo ""
            echo "Deploy by SHA or digest, not by this tag -- see docs/adr/0003-deploy-by-sha.md."
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s (%h)' -20
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
