# PLACEHOLDERS ONLY (§3.3). Real values never enter git.
#
# base64 is encoding, not encryption: `echo <value> | base64 -d` reverses it
# in one command, which is why a real key in a committed manifest is -15 marks
# even when it "looks" encrypted.
#
# Fill it in on the cluster instead, from a shell that has the real values:
#
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# In CI those come from GitHub Secrets (see .github/workflows/cd.yml).
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
  GROQ_API_KEY: "REPLACE_ME_AT_DEPLOY_TIME"
