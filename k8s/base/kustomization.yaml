apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: civicpulse
      app.kubernetes.io/managed-by: kustomize
