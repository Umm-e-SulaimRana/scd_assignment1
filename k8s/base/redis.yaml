# Redis as a Deployment + PVC, which §3.3 asks for explicitly -- and the
# contrast with Postgres above is the lesson. Redis here holds a rebuildable
# cache and a rate-limiter window, one replica, no ordinal identity needed.
# Postgres holds the only copy of every complaint. Same storage primitive,
# different controller, because the failure modes are different.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisdata
  namespace: civicpulse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  strategy:
    # Recreate, not RollingUpdate. A ReadWriteOnce volume can only be mounted
    # by one node at a time, so a rolling update would start a new pod that
    # blocks forever waiting for a volume the old pod still holds. Recreate
    # costs a few seconds of cache downtime, which is survivable; a wedged
    # rollout is not.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: civicpulse
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          args:
            # AOF on a named volume, per §2.4. Justification in
            # docs/ENGINEERING-NOTES.md: the rate-limiter counters are not
            # rebuildable state -- losing them on restart hands every client a
            # fresh quota at the exact moment an abusive one would retry.
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            # Replaying a large AOF file on boot is slow, and is not failure.
            exec: { command: ["redis-cli", "ping"] }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: redisdata
              mountPath: /data
      volumes:
        - name: redisdata
          persistentVolumeClaim:
            claimName: redisdata
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
