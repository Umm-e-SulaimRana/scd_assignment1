# One host, two paths (§3.3). / goes to the frontend, /api goes to the
# backend. The ordering matters: the ingress controller matches the most
# specific prefix first, so /api never falls through to the SPA.
#
# Note that this means the browser reaches /api on the SAME origin as the app
# in the cluster too, exactly as nginx arranges in Compose. That consistency
# is why there is no environment-specific API URL anywhere (ADR 0002).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  namespace: civicpulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"   # a triage call can take ~10s + a retry
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
