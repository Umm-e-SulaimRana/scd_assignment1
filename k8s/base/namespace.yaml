# §3.3: everything in civicpulse, never default. `default` has no resource
# quota, no NetworkPolicy boundary, and no way to delete the whole app in one
# command -- `kubectl delete ns civicpulse` is the teardown.
apiVersion: v1
kind: Namespace
metadata:
  name: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
